# Inside the frontend container: static files, /api to the webhook (prefix stripped, as the Vite dev proxy does) and
# Socket.IO. Put TLS and your domain in front of it (Dokploy, Caddy, a host nginx or Cloudflare).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Docker's DNS, so nginx starts even when the webhook is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $webhook http://webhook:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        # Streaming responses (AI, SSE) go through unbuffered
        proxy_buffering off;
    }

    # The frontend connects Socket.IO at /api/socket.io
    location /api/socket.io/ {
        set $webhook http://webhook:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Hashed build output never changes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
